<!-- ===================== PROFILE MODAL ===================== -->
<div id="profile-modal"
     class="hidden fixed inset-0 bg-navy/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 border-2 gold-border-solid">

        <!-- Profile Header -->
        <div class="flex items-center justify-between border-b gold-border pb-3">

            <div class="flex items-center space-x-3">

                <div class="w-11 h-11 rounded-xl gold-gradient text-navy-dark flex items-center justify-center font-black text-base shadow-md">
                    C
                </div>

                <div>
                    <h3 class="font-extrabold text-navy text-base">
                        Captain
                    </h3>

                    <p class="text-xs text-navy/50">
                        Port Administrator
                    </p>
                </div>

            </div>

            <button onclick="closeModal('profile-modal')"
                    class="text-navy/50 hover:text-navy transition">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>

        </div>


        <!-- Profile Information -->
        <div class="mt-5 space-y-4 text-xs">

            <!-- Name -->
            <div>
                <p class="text-navy/50 font-bold uppercase text-[10px]">
                    Name
                </p>

                <p class="text-navy font-bold mt-1">
                    Captain
                </p>
            </div>

            

            <!-- Username -->
            <div>
                <p class="text-navy/50 font-bold uppercase text-[10px]">
                    Username
                </p>

                <p class="text-navy font-bold mt-1">
                    Captain
                </p>
            </div>


            <!-- Email -->
            <div>
                <p class="text-navy/50 font-bold uppercase text-[10px]">
                    Email Address
                </p>

                <p class="text-navy font-bold mt-1">
                    captain@harryport.com
                </p>
            </div>


            <!-- Phone -->
            <div>
                <p class="text-navy/50 font-bold uppercase text-[10px]">
                    Phone No.
                </p>

                <p class="text-navy font-bold mt-1">
                    +60 12-345 6789
                </p>
            </div>


            <!-- Last Login -->
            <div>
                <p class="text-navy/50 font-bold uppercase text-[10px]">
                    Last Login
                </p>

                <p class="text-navy font-bold mt-1">
                    20 Sep 2026, 09:42 AM
                </p>
            </div>

            <!-- Sign Out -->
            <div class="mt-5 pt-4 border-t gold-border">
                <button onclick="openLogoutModal()"
                        class="w-full flex items-center justify-center space-x-2 py-2.5 rounded-xl text-rose-500 hover:bg-rose-50 transition">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span class="font-bold text-xs">Sign Out</span>
                </button>
            </div>

        </div>

    </div>
</div>
