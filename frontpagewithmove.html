<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HarryPort | Operations Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            DEFAULT: '#182536',
                            dark: '#0f1824',
                            light: '#23344a',
                            surface: '#1c2d42'
                        },
                        gold: {
                            DEFAULT: '#C6A15B',
                            light: '#d9b675',
                            dark: '#a8833e',
                            muted: '#e6cf9c'
                        },
                        ivory: {
                            DEFAULT: '#F2E9DA',
                            light: '#faf6ee',
                            card: '#f9f4ec',
                            dark: '#e3d6be'
                        }
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

</head>
<body class="h-screen w-screen flex overflow-hidden bg-ivory">

    <div id="sidebar-container"></div>

    <main class="flex-1 flex flex-col h-full overflow-hidden bg-ivory">
        
       <!-- Header -->
        <div id="header-container"></div>
        <div id="profile-container"></div>
        <div id="logout-container"></div>

        <div class="flex-1 overflow-y-auto p-6 bg-ivory">

            <div id="inbox-container"></div>

            <div id="humanreview-container"></div>

            <div id="spam-container"></div>

        </div>
    </main>

    <!-- Modals -->
    <div id="settings-modal" class="hidden fixed inset-0 bg-navy/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 space-y-4 border-2 gold-border-solid relative">

            <!-- Header -->
            <div class="flex items-center justify-between border-b gold-border pb-3">
                    <h3 class="font-extrabold text-navy text-base flex items-center">
                    <i class="fa-solid fa-gear gold-text mr-2"></i>
                    System Settings
                </h3>

                <button onclick="closeModal('settings-modal')" class="text-navy/50 hover:text-navy">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

        <!-- Appearance -->
        <div class="space-y-3 text-xs text-navy">

            <div class="flex items-center justify-between p-4 bg-ivory rounded-xl border gold-border">

                <div>
                    <span class="font-bold block text-sm">Appearance</span>
                    <span id="theme-label" class="text-navy/50 text-[11px]">
                        Light Mode
                    </span>
                </div>

                <!-- Dark Mode Toggle -->
                <button
                    id="theme-toggle"
                    onclick="toggleDarkMode()"
                    class="relative w-14 h-7 bg-gold rounded-full transition duration-300 focus:outline-none"
                    aria-label="Toggle dark mode"
                >
                    <span
                        id="theme-toggle-circle"
                        class="absolute top-1 left-1 w-5 h-5 bg-white rounded-full shadow-md transition-transform duration-300"
                    ></span>
                </button>

            </div>

        </div>

        <!-- Save & Close -->
        <button
            onclick="closeModal('settings-modal')"
            class="w-full py-2.5 gold-gradient text-navy-dark font-black text-xs rounded-xl shadow hover:brightness-105 transition"
        >
            Save & Close
        </button>

        </div>
        </div>

    <div id="logout-modal" class="hidden fixed inset-0 bg-navy/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 text-center space-y-4 border-2 gold-border-solid">
            <div class="w-12 h-12 bg-rose-100 text-rose-700 rounded-full flex items-center justify-center text-xl mx-auto border border-rose-200">
                <i class="fa-solid fa-right-from-bracket"></i>
            </div>
            <div>
                <h3 class="font-extrabold text-navy text-base">Confirm Logout</h3>
                <p class="text-xs text-navy/60 mt-1">Are you sure you want to exit your HarryPort session?</p>
            </div>
            <div class="flex space-x-3">
                <button onclick="closeModal('logout-modal')" class="flex-1 py-2.5 bg-ivory text-navy font-bold text-xs rounded-xl border gold-border">
                    Cancel
                </button>
                <button onclick="closeModal('logout-modal')" class="flex-1 py-2.5 bg-rose-700 hover:bg-rose-800 text-white font-bold text-xs rounded-xl shadow">
                    Log Out
                </button>
            </div>
        </div>
    </div>

    <script>

        // 1. Advance Filter & Search for Inbox
        function applyFilters() {
            const query = document.getElementById('email-search').value.toLowerCase();
            const activeCategory = document.getElementById('category-filter').value;
            const rows = document.querySelectorAll('.email-row');
            let visibleCount = 0;

            rows.forEach(row => {
                const cat = row.getAttribute('data-category');
                const matchesCategory = (activeCategory === 'All') || (cat === activeCategory);
                const matchesQuery = row.innerText.toLowerCase().includes(query);
                
                if (matchesCategory && matchesQuery) {
                    row.style.display = 'flex';
                    visibleCount++;
                } else {
                    row.style.display = 'none';
                }
            });

            const countText = document.getElementById('showing-count');
            if (query) {
                countText.innerHTML = `Found <span class="text-gold font-bold">${visibleCount}</span> result(s) for "<span class="text-white">${document.getElementById('email-search').value}</span>"`;
            } else {
                countText.innerText = activeCategory === 'All' 
                    ? `Showing all ${visibleCount} emails` 
                    : `Showing ${visibleCount} email(s) in "${activeCategory}"`;
            }
        }

        // 2. Specific Search for Spam
        function applySpamSearch() {
            const query = document.getElementById('spam-search').value.toLowerCase();
            const rows = document.querySelectorAll('.spam-item');
            let visibleCount = 0;

            rows.forEach(row => {
                const matchesQuery = row.innerText.toLowerCase().includes(query);
                if (matchesQuery) {
                    row.style.display = 'flex';
                    visibleCount++;
                } else {
                    row.style.display = 'none';
                }
            });

            const emptyState = document.getElementById('spam-empty-state');
            if (visibleCount === 0 && rows.length > 0) {
                emptyState.classList.remove('hidden');
                emptyState.querySelector('h3').innerText = "No spam matched your search";
            } else if (visibleCount > 0) {
                emptyState.classList.add('hidden');
            } else if (rows.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.querySelector('h3').innerText = "Spam Folder is Empty";
            }
        }

        // 3. Move Email Across Categories (WITH DOUBLE BADGE RE-IMPLEMENTATION)
        function changeEmailCategory(selectElement) {
            const newCategory = selectElement.value;
            if (!newCategory) return;

            const item = selectElement.closest('.spam-item') || selectElement.closest('.email-row');
            
            // Extract text cleanly without HTML tags
            const rawSenderHTML = item.querySelector('h4').innerHTML;
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = rawSenderHTML;
            const cleanSender = tempDiv.innerText.replace(/<[^>]*>?/gm, ''); 
            const initial = cleanSender.charAt(0).toUpperCase();

            // Extract title and preview
            const paragraphs = item.querySelectorAll('.min-w-0 > p');
            const title = paragraphs[0] ? paragraphs[0].innerText : '';
            const preview = paragraphs[1] ? paragraphs[1].innerText : '';
            
            item.remove();

            let catBadgeClass = '';
            let statusBadgeClass = '';
            let statusText = '';
            let iconClass = '';
            let displayCategory = newCategory;

            if (newCategory === 'Spam') {
                iconClass = 'bg-rose-100 text-rose-800 border border-rose-300';
                catBadgeClass = 'bg-rose-100 text-rose-800 border border-rose-300';
                statusBadgeClass = 'bg-slate-200 text-slate-700 border border-slate-300';
                statusText = 'Status: Flagged';
                displayCategory = 'Spam';
            } else {
                statusBadgeClass = 'bg-emerald-100 text-emerald-800 border border-emerald-300';
                statusText = 'Status: Classified';
                
                if (newCategory === 'Comparison requests') {
                    catBadgeClass = iconClass = 'bg-navy text-gold border gold-border';
                    displayCategory = 'Comparison';
                } else if (newCategory === 'New SI requests') {
                    catBadgeClass = iconClass = 'bg-amber-100 text-amber-900 border border-amber-300';
                    displayCategory = 'New SI';
                } else if (newCategory === 'Invoice queries') {
                    catBadgeClass = iconClass = 'bg-amber-900 text-amber-100 border border-amber-700';
                    displayCategory = 'Invoice';
                } else if (newCategory === 'General mail') {
                    catBadgeClass = iconClass = 'bg-slate-200 text-slate-800 border border-slate-300';
                    displayCategory = 'General';
                }
            }

            if (newCategory === 'Spam') {
                const newRow = document.createElement('div');
                newRow.className = 'spam-item p-4 hover:bg-rose-50/50 transition flex items-center justify-between group';
                newRow.innerHTML = `
                    <div class="flex items-center space-x-4 min-w-0">
                        <div class="w-10 h-10 rounded-xl ${iconClass} font-extrabold flex items-center justify-center shrink-0">${initial}</div>
                        <div class="min-w-0">
                            <h4 class="font-bold text-sm text-navy truncate line-through decoration-rose-500">${cleanSender}</h4>
                            <div class="flex items-center space-x-2 mt-1">
                                <span class="px-2 py-0.5 ${catBadgeClass} text-[9px] font-extrabold rounded uppercase tracking-wide">Category: Spam</span>
                                <span class="px-2 py-0.5 ${statusBadgeClass} text-[9px] font-extrabold rounded uppercase tracking-wide">${statusText}</span>
                            </div>
                            <p class="text-xs font-bold text-navy/90 truncate mt-1.5">${title}</p>
                            <p class="text-xs text-navy/60 truncate">${preview}</p>
                        </div>
                    </div>
                    <div class="flex items-center ml-4 shrink-0 space-x-2">
                        <select onchange="changeEmailCategory(this)" class="px-2 py-1.5 bg-navy text-ivory text-[10px] font-bold rounded-lg border gold-border focus:outline-none opacity-0 group-hover:opacity-100 transition cursor-pointer shadow-sm hover:ring-2 hover:ring-gold/50">
                            <option value="" disabled selected>Move to...</option>
                            <option value="Comparison requests">Comparison</option>
                            <option value="New SI requests">New SI</option>
                            <option value="Invoice queries">Invoice</option>
                            <option value="General mail">General</option>
                        </select>
                        <button onclick="deleteSpamRow(this)" class="px-3 py-1.5 bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold rounded-lg shadow-sm transition transform hover:-translate-y-0.5 flex items-center opacity-0 group-hover:opacity-100">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
                document.getElementById('spam-list').appendChild(newRow);
                document.getElementById('spam-empty-state').classList.add('hidden');
                
            } else {
                const newRow = document.createElement('div');
                newRow.className = `email-row p-4 hover:bg-ivory-light/80 transition cursor-pointer flex items-center justify-between group`;
                newRow.setAttribute('data-category', newCategory);
                
                newRow.innerHTML = `
                    <div class="flex items-center space-x-4 min-w-0">
                        <div class="w-10 h-10 rounded-xl ${iconClass} font-extrabold flex items-center justify-center shrink-0 group-hover:scale-105 transition-transform shadow-sm">${initial}</div>
                        <div class="min-w-0">
                            <h4 class="font-bold text-sm text-navy truncate">${cleanSender}</h4>
                            <div class="flex items-center space-x-2 mt-1">
                                <span class="px-2 py-0.5 ${catBadgeClass} text-[9px] font-extrabold rounded uppercase tracking-wide">Category: ${displayCategory}</span>
                                <span class="px-2 py-0.5 ${statusBadgeClass} text-[9px] font-extrabold rounded uppercase tracking-wide">${statusText}</span>
                            </div>
                            <p class="text-xs font-bold text-navy/90 truncate mt-1.5">${title}</p>
                            <p class="text-xs text-navy/60 truncate">${preview}</p>
                        </div>
                    </div>
                    <div class="flex items-center ml-4 shrink-0 space-x-2">
                        <select onchange="changeEmailCategory(this)" class="px-2 py-1.5 bg-navy text-ivory text-[10px] font-bold rounded-lg border gold-border focus:outline-none opacity-0 group-hover:opacity-100 transition cursor-pointer shadow-sm hover:ring-2 hover:ring-gold/50">
                            <option value="" disabled selected>Move to...</option>
                            <option value="Comparison requests">Comparison</option>
                            <option value="New SI requests">New SI</option>
                            <option value="Invoice queries">Invoice</option>
                            <option value="General mail">General</option>
                            <option value="Spam">Spam</option>
                        </select>
                    </div>
                `;
                document.getElementById('email-list').appendChild(newRow);
            }

            updateCategoryCounts();
            applyFilters();
            applySpamSearch();
        }

        // 4. Update Sidebar Stats
        function updateCategoryCounts() {
            const inboxRows = document.querySelectorAll('.email-row');
            const counts = {
                'Comparison requests': 0,
                'New SI requests': 0,
                'Invoice queries': 0,
                'General mail': 0
            };
            let total = 0;
            inboxRows.forEach(row => {
                const cat = row.getAttribute('data-category');
                if (counts.hasOwnProperty(cat)) {
                    counts[cat]++;
                }
                total++;
            });

            document.getElementById('sidebar-count-comparison').innerText = counts['Comparison requests'];
            document.getElementById('sidebar-count-si').innerText = counts['New SI requests'];
            document.getElementById('sidebar-count-invoice').innerText = counts['Invoice queries'];
            document.getElementById('sidebar-count-general').innerText = counts['General mail'];

            document.getElementById('opt-all').innerText = `All Categories (${total})`;
            document.getElementById('opt-comparison').innerText = `Comparison requests (${counts['Comparison requests']})`;
            document.getElementById('opt-si').innerText = `New SI requests (${counts['New SI requests']})`;
            document.getElementById('opt-invoice').innerText = `Invoice queries (${counts['Invoice queries']})`;
            document.getElementById('opt-general').innerText = `General mail (${counts['General mail']})`;

            updateSpamCountUI();
        }

        function deleteSpamRow(btn) {
            btn.closest('.spam-item').remove();
            updateSpamCountUI();
            applySpamSearch();
        }

        function emptySpam() {
            document.getElementById('spam-list').innerHTML = '';
            updateSpamCountUI();
            applySpamSearch();
        }

        function updateSpamCountUI() {
            const spamCount = document.querySelectorAll('.spam-item').length;
            document.getElementById('sidebar-count-spam').innerText = spamCount;
            if (spamCount === 0) {
                document.getElementById('spam-empty-state').classList.remove('hidden');
                document.getElementById('spam-empty-state').querySelector('h3').innerText = "Spam Folder is Empty";
            }
        }

        // 5. Sidebar Integrations
        function selectCategoryFromSidebar(category) {
        // Show Inbox view
        document.getElementById('view-inbox').classList.remove('hidden');
        document.getElementById('view-human-review').classList.add('hidden');

        const spamView = document.getElementById('view-spam');
        if (spamView) {
            spamView.classList.add('hidden');
        }

        // Change page title
        document.getElementById('page-title').innerText = 'Inbox';

        // Set selected category
        const categoryFilter = document.getElementById('category-filter');
        categoryFilter.value = category;

        // Clear search
        document.getElementById('email-search').value = '';

        // Apply category filter
        applyFilters();
        }

        // 6. View Switcher (Handles Inbox, HR, Spam)
            function switchView(view) {

            const isInbox = view === 'inbox';
            const isReview = view === 'human-review';
            const isSpam = view === 'spam';

            document.getElementById('view-inbox')
            .classList.toggle('hidden', !isInbox);

            document.getElementById('view-human-review')
            .classList.toggle('hidden', !isReview);

            const spamView = document.getElementById('view-spam');

            if (spamView) {
            spamView.classList.toggle('hidden', !isSpam);
            }

            // =========================
            // Change page title
            // =========================

            if (isInbox) {
            document.getElementById('page-title').innerText = 'Inbox';

            } else if (isReview) {
            document.getElementById('page-title').innerText = 'Human Review';

            } else if (isSpam) {
            document.getElementById('page-title').innerText = 'Spam Folder';
            }

            // =========================
            // Clear searches
            // =========================

            const emailSearch = document.getElementById('email-search');

            if (emailSearch) {
                emailSearch.value = '';
            }

            const spamSearch = document.getElementById('spam-search');

            if (spamSearch) {
                spamSearch.value = '';
            }

            // =========================
            // Apply current view
            // =========================

            if (isInbox) {
                applyFilters();
            }

            if (isSpam) {
                applySpamSearch();
            }
        }

        // 7. Friend's Original Sub-Navigation Function (Preserved)
        function switchReviewSubPage(subPage) {
            switchView('human-review');

            const pages = [
                'hr-sub-dashboard', 
                'hr-sub-unreadable-list', 
                'hr-sub-unreadable-detail', 
                'hr-sub-corrupted-list', 
                'hr-sub-corrupted-detail',
                'hr-sub-resolved-list'
            ];

            pages.forEach(p => {
                const el = document.getElementById(p);
                if (el) el.classList.add('hidden');
            });

            const target = document.getElementById('hr-sub-' + subPage);
            if (target) target.classList.remove('hidden');
        }
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');

            const isDarkMode = document.body.classList.contains('dark-mode');

            const toggleCircle = document.getElementById('theme-toggle-circle');
            const themeLabel = document.getElementById('theme-label');

            if (isDarkMode) {
                toggleCircle.classList.add('translate-x-7');
                themeLabel.innerText = 'Dark Mode';
            } else {
                toggleCircle.classList.remove('translate-x-7');
                themeLabel.innerText = 'Light Mode';
            }
        }

        // Minor Utilities
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('w-64');
            sidebar.classList.toggle('w-20');
            document.querySelectorAll('.sidebar-text').forEach(el => el.classList.toggle('hidden'));
            document.getElementById('brand-text').classList.toggle('hidden');
        }
        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        window.onload = function() {
            updateCategoryCounts();
        };
    </script>
    <script src="js/components.js"></script>
    <script src="js/humanreview.js"></script>
</body>
</html>
